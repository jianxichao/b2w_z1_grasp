schema_version: 1

model: ARX_X5
base_frame: arm_base
tcp_frame: tcp

kinematics:
  tcp_offset_xyz_m: [0.045, 0.0, 0.0]
  base_correction_xyz_m: [-0.0006, -0.0019, 0.00225]

joints:
  # IK 限位对齐 ARX5 SDK 默认范围（j3 上限保留 270° 以支持倒置姿态实验）
  - {name: joint1, axis: [0.0, 0.0, 1.0], origin_xyz_m: [0.0, 0.0, 0.0603], origin_rpy_rad: [0.0, 0.0, 0.0], limits_rad: [-3.14, 2.618]}
