  # 270 deg = 4.71238898 rad.  This is a software limit for the inverted-pose
  # experiment; verify the mechanical stop and SDK support before real motion.
  - {name: joint3, axis: [0.0, 1.0, 0.0], origin_xyz_m: [-0.264, 0.0, 0.0], origin_rpy_rad: [-3.1416, 0.0, 0.0], limits_rad: [-1.57, 4.712389]}
  - {name: joint4, axis: [0.0, 1.0, 0.0], origin_xyz_m: [0.245, 0.0, -0.056], origin_rpy_rad: [0.0, 0.0, 0.0], limits_rad: [-1.7453, 1.7453]}
  - {name: joint5, axis: [0.0, 0.0, 1.0], origin_xyz_m: [0.06575, -0.001, -0.0825], origin_rpy_rad: [0.0, 0.0, 0.0], limits_rad: [-1.7453, 1.7453]}
  - {name: joint6, axis: [1.0, 0.0, 0.0], origin_xyz_m: [0.02845, 0.0, 0.0825], origin_rpy_rad: [-3.1416, 0.0, 0.0], limits_rad: [-2.0, 2.0]}
