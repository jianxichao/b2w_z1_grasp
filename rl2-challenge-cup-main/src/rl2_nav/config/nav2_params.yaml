# Week01 navigation parameters.
#
# waypoint_nav_node is the current minimal odom -> cmd_vel smoke test.
# The Nav2 sections keep the frame/topic contract explicit for full Nav2 bringup.

waypoint_nav_node:
  ros__parameters:
    use_sim_time: true
    odom_topic: /slam/odom
    cmd_vel_topic: /cmd_vel_nav
    target_x: 1.0
    target_y: 0.0
    target_yaw: 0.0
    position_tolerance: 0.20
    yaw_tolerance: 0.25
    max_linear_speed: 0.40
    max_angular_speed: 0.50
    linear_kp: 0.45
    angular_kp: 1.20
    rotate_in_place_threshold: 0.60
    control_rate: 10.0
    autostart: false
    stop_hold_duration: 2.0

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /slam/odom
    bt_loop_duration: 10
    default_server_timeout: 60
    default_nav_to_pose_bt_xml: "$(find-pkg-share rl2_nav)/config/navigate_to_pose_fast_recovery.xml"

controller_server:
  ros__parameters:
    use_sim_time: true
    odom_topic: /slam/odom
    controller_frequency: 12.0
    min_x_velocity_threshold: 0.001
    # Normal navigation is differential-style: drive forward and turn only.
    # Lateral motion is reserved for the bounded wall-escape recovery channel.
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.001
    progress_checker_plugin: progress_checker
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.15
      # This is a no-progress limit, not total travel time.  A moving robot may
      # navigate indefinitely; a truly stuck controller returns within 15s so
      # Frontier can blacklist the region and select a different direction.
      movement_time_allowance: 15.0
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      # Keep this below the 0.20 m real-robot smoke-test distance.  DWB reads
      # the tolerance while it is configured, so changing it after activation
      # does not reliably update the RotateToGoal critic.
      # 0.05 was below the 5 cm map resolution and caused endless nudging.
      # 0.08 is still resolvable. The task layer independently accepts the
      # physically safe 0.20-0.50m target-distance band, so a normal short
      # stop does not cause a replan around the cube.
      xy_goal_tolerance: 0.08
      # Side-on arrival is legal: target distance matters more than exact
      # heading, and forcing the final rotate-in-place can knock over a cube.
      # 1.05 rad (~60 deg) lets Nav2 finish without repeated head wagging; the
      # fixed target lock handles the near-field camera blind spot.
      # (2026-09-30 measurement note: 0.10 rad produced 2.4-3.1deg final yaw
      # error; field feedback on 2026-10-08 now deliberately prioritizes close
      # position and collision avoidance over that final heading precision.)
      yaw_goal_tolerance: 1.05
      stateful: true
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      debug_trajectory_details: false
      min_vel_x: 0.0
      # Normal Nav2 motion is deliberately non-holonomic.  Lateral motion is
      # reserved for the isolated /cmd_vel_recovery escape channel, so small
      # DWB corrections cannot make the robot drift diagonally toward a wall.
      min_vel_y: 0.0
      max_vel_x: 0.40
      max_vel_y: 0.0
      max_vel_theta: 0.50
      min_speed_xy: 0.02
      max_speed_xy: 0.40
      min_speed_theta: 0.0
      acc_lim_x: 0.50
      acc_lim_y: 0.50
      acc_lim_theta: 0.65
      decel_lim_x: -0.50
      decel_lim_y: -0.50
      decel_lim_theta: -0.75
      vx_samples: 16
      vy_samples: 9
      vtheta_samples: 26
      sim_time: 1.2
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.5
      # Match general_goal_checker: see the comment above.
      xy_goal_tolerance: 0.08
      trans_stopped_velocity: 0.03
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics: ["Oscillation", "BaseObstacle", "PathAlign", "PathDist", "GoalDist", "GoalAlign", "RotateToGoal"]
      BaseObstacle.scale: 0.12
      PathAlign.scale: 6.0
      PathAlign.forward_point_distance: 0.35
      GoalAlign.scale: 3.0
      GoalAlign.forward_point_distance: 0.35
      PathDist.scale: 10.0
      GoalDist.scale: 8.0
      RotateToGoal.scale: 4.0
      RotateToGoal.slowing_factor: 2.0
      RotateToGoal.lookahead_time: -1.0

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      # NavfnPlanner在目标点紧贴unknown边界时有个已知bug："Failed to create
      # a plan from potential when a legal potential was found"：势场
      # (potential field)本身求出来是合法的，但从目标点往回做梯度回溯
      # (backtrace)时如果势场出现平坦区就会失败。frontier探索的目标天生
      # 贴着unknown边界，几乎必然会撞上这个bug，之前试过的use_astar:false
      # 只是换了势场传播策略，没有改变回溯这一步，所以没根治。
      # SmacPlanner2D是纯格点A*搜索，路径直接从访问过的节点链回溯，没有
      # "势场梯度回溯"这一步，不存在这个bug模式，是Humble自带包，不需要
      # 额外安装。
      plugin: nav2_smac_planner/SmacPlanner2D
      tolerance: 0.5
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: false

smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_footprint
      update_frequency: 5.0
      publish_frequency: 2.0
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      # GO2-W 本体是 0.68x0.44 的矩形，圆近似 0.35 在窄侧多算了 ~13cm，
      # 门洞被误判不可通过。改用真实矩形 footprint（设置后 robot_radius
      # 被 nav2 忽略）；与桥的足迹清除尺寸(0.34/0.22)一致。
      footprint: "[[0.34,0.22],[0.34,-0.22],[-0.34,-0.22],[-0.34,0.22]]"
      # costmap_raw默认只在第一次current时完整发布一次，之后全靠
      # costmap_updates增量。behavior_server的CostmapSubscriber
      # (backup/drive_on_heading用)是在local_costmap激活之后才订阅，
      # 依赖TRANSIENT_LOCAL的历史缓存拿到那条唯一的历史消息，实测这个
      # 时序在本环境里不可靠，导致behavior_server永远收不到costmap，
      # 每次触发backup都报"Costmap is not available"。打开这个选项后
      # 每个发布周期都重发完整快照，不再依赖那条历史消息。
      always_send_full_costmap: true
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        footprint_clearing_enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          obstacle_max_range: 6.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 4.0
        # 0.38 只比本体半径大 3cm，近墙时 DWB 轨迹几乎无成本梯度可选。
        # 0.55 = 半长边 0.34 + 0.21 缓冲。
        inflation_radius: 0.55

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_footprint
      update_frequency: 2.0
      publish_frequency: 2.0
      resolution: 0.05
      # 同 local_costmap：矩形本体 footprint 取代 0.35 圆近似。
      footprint: "[[0.34,0.22],[0.34,-0.22],[-0.34,-0.22],[-0.34,0.22]]"
      track_unknown_space: true
      # 跟local_costmap同样的原因，防止behavior_server晚订阅时错过
      # costmap_raw的唯一一条历史消息，一起打开。
      always_send_full_costmap: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /navigation_map
        # The live bridge publishes a volatile map, not map_server's latched map.
        map_subscribe_transient_local: false
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        footprint_clearing_enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          obstacle_max_range: 6.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 4.0
        # 全局层离墙更远些：SmacPlanner2D 选路时就把缓冲吃进去，
        # 0.65 = 0.34 + 0.31，避免贴墙全局路径把局部层逼进死角。
        inflation_radius: 0.65

behavior_server:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.5
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    drive_on_heading:
      plugin: nav2_behaviors/DriveOnHeading
    wait:
      plugin: nav2_behaviors/Wait
    simulate_ahead_time: 2.0
    # This server's Spin action is used by the mission's visual scan, not by
    # normal path tracking.  Keep it deliberately slow so D435i/YOLO receives
    # enough consecutive views of a target while the robot rotates.
    max_rotational_vel: 0.15
    min_rotational_vel: 0.15
    rotational_acc_lim: 0.25

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [0.40, 0.0, 0.50]
    min_velocity: [0.0, 0.0, -0.50]
    max_accel: [0.50, 0.0, 0.65]
    max_decel: [-0.50, 0.0, -0.75]
    odom_topic: /slam/odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.3

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: true
    autostart: true
    node_names:
      - controller_server
      - smoother_server
      - planner_server
      - behavior_server
      - bt_navigator
      - waypoint_follower
      - velocity_smoother
